<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';">
<title>Kenya Police Service | Secure Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  
    <!--background image and tint-->
  <div class="bg-photo" role="presentation" aria-hidden="true"></div>
  <div class="bg-tint" aria-hidden="true"></div>
<!--the login card-->
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="shield-logo">
        <span class="material-symbols-outlined">
local_police
</span>
        </div>
        <h2>Kenya Police Service</h2>
        <p class="subtitle">Utumishi kwa wote</p>
      </div>
      <form id="LoginForm">
        <div class="input-group">
          <label for="serviceNumber">AP Number / Service Number</label>
                    <div class="input-field">
                         <span class="material-symbols-outlined">account_circle</span>
                        <input type="text" id="serviceNumber" placeholder="e.g. AP001" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                      <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="password" placeholder="Enter password" required>
                        <span class="material-symbols-outlined">password</span>
                    </div>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
                <p id="error-message" class="error-msg"></p>
            </form>

            <div class="card-footer">
                <p class="auth-notice">Authorized personnel only. All activities are logged.</p>
                <a href="#" class="public-link">Are you a member of the public? Report an incident here →</a>
            </div>
        </div>
    </div>

    
        </div>
      
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
