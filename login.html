<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>Kenya Police Service | Secure Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <!--background image and tint-->
  <div class="bg-photo" role="presentation" aria-hidden="true"></div>
  <div class="bg-tint" aria-hidden="true"></div>
<!--the login card-->
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="shield-logo">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Kenya Police Service</h2>
        <p class="subtitle">Utumishi kwa wote</p>
      </div>
      <form id="LoginForm">
        <div class="input-group">
          <label for="serviceNumber">AP Number / Service Number</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="serviceNumber" placeholder="e.g. AP001" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
                <p id="error-message" class="error-msg"></p>
            </form>

            <div class="card-footer">
                <p class="auth-notice">Authorized personnel only. All activities are logged.</p>
                <a href="#" class="public-link">Are you a member of the public? Report an incident here →</a>
            </div>
        </div>
    </div>

    
        </div>
      
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
