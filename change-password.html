<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';">
    <title>Kenya Police Service | Change Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h1>Change password</h1>
        <p id="hint" class="muted">Use at least 10 characters with a capital letter, a lowercase letter and a number.</p>
        <form id="pwForm" autocomplete="off">
            <div class="input-group"><input type="password" id="current" placeholder="Current (or temporary) password" autocomplete="current-password" required></div>
            <div class="input-group"><input type="password" id="new" placeholder="New password" autocomplete="new-password" required></div>
            <div class="input-group"><input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password" required></div>
            <p id="msg" class="error-msg" role="alert" hidden></p>
            <button type="submit" class="login-btn">Update password</button>
        </form>
    </main>
    <script src="change-password.js"></script>
</body>
</html>
